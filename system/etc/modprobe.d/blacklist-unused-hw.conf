# Thunderbolt 2 controller — nur USB-A Ports werden genutzt
blacklist thunderbolt

# Apple FaceTime HD Camera — bereits via blacklist-facetimehd.conf, hier als Referenz
# blacklist facetimehd

# Audio (beide Intel HD Audio Controller) + internes Mikrofon (Cirrus-Codec) — nicht benötigt
blacklist snd_hda_intel
blacklist snd_hda_codec_cs420x

# Bluetooth — aktiv (Logitech BT-Tastatur), Stromsparen via btusb-autosuspend
# blacklist btusb
# blacklist bluetooth

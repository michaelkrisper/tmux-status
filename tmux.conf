# Truecolor durchreichen (foot kann RGB, tmux muss es wissen)
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10          # sonst haengt ESC in TUIs wie Claude Code
set -g focus-events on

# Ctrl-b C = neue Claude-Session in eigenem Fenster
bind C new-window -c "#{pane_current_path}" claude
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Statuszeile passend zu catppuccin-mocha
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left ""
set -g status-interval 5
set -g status-right-length 90
set -g status-right "#(~/.local/bin/tmux-status --loop 5) %H:%M "
setw -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
# Fenstername: Claude setzt per OSC einen Titel (pane_title); Shells lassen
# ihn auf dem Hostnamen stehen -> dann stattdessen den Ordner zeigen.
setw -g window-status-format         " #I #{=/20/…:#{?#{==:#{pane_title},#{host_short}},#{b:pane_current_path},#{pane_title}}} "
setw -g window-status-current-format " #I #{=/20/…:#{?#{==:#{pane_title},#{host_short}},#{b:pane_current_path},#{pane_title}}} "
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-style "fg=#45475a"


# Alt-Tab schaltet aufs naechste Fenster (ohne Prefix)
bind -n M-Tab next-window
# Ctrl-T = neues Terminal-Fenster (ohne Prefix)
bind -n C-t new-window -c "#{pane_current_path}"

# Blankes Bild-auf (Fn+Pfeil auf der MX Keys) springt in den Verlauf
bind -n PPage copy-mode -u

# Kopiertes landet direkt in der Wayland-Zwischenablage: tmux schickt es per
# OSC 52 an foot, foot an den Compositor -- damit kommt Ctrl+V in Chrome an.
set -s set-clipboard on
set -as terminal-features ",foot*:clipboard"
